<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方案不存在 | 见微 GEO</title>
  <meta name="robots" content="noindex, follow">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Noto Sans SC',sans-serif}.serif{font-family:'Noto Serif SC',serif}</style>
</head>
<body class="bg-[#f4f1ea] text-[#26221c] min-h-screen flex items-center justify-center px-6">
  <div class="max-w-xl text-center">
    <div class="serif text-7xl font-black text-[#5a7d5a] mb-4">404</div>
    <h1 class="serif text-3xl font-black mb-4">这个行业方案还没上线</h1>
    <p class="text-[#6b655b] text-lg mb-8">你要找的行业页面暂时不存在，但见微覆盖的行业正在快速增加。看看下面已上线的方案，或直接免费查一次你的 AI 可见度。</p>
    {% if all_solutions %}
    <div class="grid gap-3 mb-8 text-left">
      {% for s in all_solutions %}
      <a href="/solutions/{{ s.slug }}" class="block bg-white border border-black/5 rounded-xl px-5 py-4 hover:border-[#5a7d5a] transition">
        <div class="font-bold">{{ s.city }}{{ s.industry }}行业 GEO 方案</div>
        <div class="text-sm text-[#6b655b]">让 AI 在 {{ s.industry }} 采购决策中优先推荐你</div>
      </a>
      {% endfor %}
    </div>
    {% endif %}
    <a href="{{ site_base }}" class="inline-block bg-[#5a7d5a] text-white px-8 py-3 rounded-full font-bold">返回见微首页 · 免费查一次</a>
  </div>
</body>
</html>
